# IBM E2E monitoring agent (10.15+ form). Replaces the broken JAVA_UHM_OPTS=
# bash-style lines that the Tanuki Java Service Wrapper silently ignored
# (wrapper.conf only honours `wrapper.*` directives). Numbering 501/502/503
# matches the IBM agent-installation docs -- see docs/e2e-agent-installation.md.
# Filename `uha-` (UHM was renamed to UHA in v10.15). Paths are absolute so
# they don't depend on wrapper.working.dir resolution. Note: dropping the
# `:"%JAVA_BOOT_CLASSPATH%"` suffix the docs include -- Tanuki silently skips
# the entire line if a referenced env var is unset, and SAG IS doesn't ship
# JAVA_BOOT_CLASSPATH in its container env.
wrapper.java.additional.501=-Xbootclasspath/a:/opt/softwareag/E2EMonitoring/agent/uha-apm-agent.jar
wrapper.java.additional.502=-javaagent:/opt/softwareag/E2EMonitoring/agent/uha-apm-agent.jar=logging.dir=/opt/softwareag/IntegrationServer/instances/default/logs/
wrapper.java.additional.503=-Dlogback.configurationFile=/opt/softwareag/IntegrationServer/instances/default/e2ecustomlogback.xml

# ##############################################################################
# JMX Prometheus exporter -- exposes JVM + IS MBeans on :9099/metrics.
# Bind-mounted at runtime from ./is-containers/jmx-exporter/ (jar + config.yaml).
# Layered alongside the E2E SkyWalking agent -- JMX exporter is passive
# (read-only). Closes the IS frontend/backend Prometheus gap (only the
# APIGW image's WmAPIGateway package exposes /metrics natively).
# Added 2026-05-04.
# ##############################################################################
wrapper.java.additional.504=-javaagent:/opt/softwareag/jmx-exporter/jmx_prometheus_javaagent.jar=9099:/opt/softwareag/jmx-exporter/jmx_exporter_config.yaml

# ##############################################################################
# Datadog Java tracer (dd-java-agent.jar) -- frontend trial only.
# Bind-mounted at runtime from ./is-containers/dd-java-agent/.
# Coexists with the IBM E2E SkyWalking agent above (line 502): IBM E2E owns
# webMethods Flow service traces (purpose-built); dd-java-agent adds the
# library/JVM trace layer (HTTP listener entry, JDBC drivers, Servlet, JMX, GC)
# that generic Java agents can intercept but IBM E2E doesn't cover.
# dd.trace.otel.enabled=true makes dd-java-agent treat the SkyWalking agent's
# OTel-spec spans as upstream context, avoiding split traces.
# Spans flow to dd-agent-frontend:8126 (DD_APM_ENABLED=true on that container).
# Added 2026-05-05.
# ##############################################################################
wrapper.java.additional.512=-javaagent:/opt/softwareag/dd-java-agent/dd-java-agent.jar
wrapper.java.additional.513=-Ddd.service=is-frontend
wrapper.java.additional.514=-Ddd.env=dev
wrapper.java.additional.515=-Ddd.version=1.0
wrapper.java.additional.516=-Ddd.agent.host=dd-agent-frontend
wrapper.java.additional.517=-Ddd.agent.port=8126
wrapper.java.additional.518=-Ddd.trace.otel.enabled=true
wrapper.java.additional.519=-Ddd.tags=role:frontend,server_alias:is_frontend,instance:IS_FRONTEND

# ##############################################################################
