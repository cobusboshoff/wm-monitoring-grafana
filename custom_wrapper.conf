# JFR-based continuous profiler. Coexists with IBM E2E (line 501),
# JMX exporter (line 504), dd-java-agent (line 512). All four agents
# in one JVM is unusual but supported -- worth watching for class-loader
# conflicts on first restart.
# Pushes 10s-windowed CPU profiles to pyroscope:4040; flame graphs render
# in Grafana via the wmObs Profiles dashboard. Added 2026-05-05.
