# ============================================================================
# Integration Server - JMX Prometheus exporter (jvm_* on :9099) - LINUX
# ----------------------------------------------------------------------------
# SNIPPET. Add to the IS instance's wrapper override on the IS Linux host:
#   <IntegrationServer>/profiles/IS_<instance>/configuration/custom_wrapper.conf
#
# ONLY needed for IS Option B (JVM metrics). Option A (native sag_is_* on :5555)
# needs NO agent - just enable the endpoint (see INSTALL.md).
#
# THE JAR (v1.2.0): both files are BUNDLED in this folder - copy them to the IS
# Linux host, e.g. to /opt/softwareag/jmx/:
#   linux-install/webmethods/jmx_prometheus_javaagent.jar
#   linux-install/webmethods/jmx_exporter_config.yaml
# The jar is pure-Java and runs identically on Linux.
#
# INDEX: use the next free wrapper.java.additional.<N>; if the wrapper reports a
# sequence gap, add  wrapper.ignore_sequence_gaps=TRUE .
# ============================================================================

wrapper.java.additional.401=-javaagent:/opt/softwareag/jmx/jmx_prometheus_javaagent.jar=9099:/opt/softwareag/jmx/jmx_exporter_config.yaml

# wrapper.ignore_sequence_gaps=TRUE
