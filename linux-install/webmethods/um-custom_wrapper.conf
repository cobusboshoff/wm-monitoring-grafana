# ============================================================================
# Universal Messaging - native sag_um_* exporter (:9200) - LINUX
# ----------------------------------------------------------------------------
# SNIPPET. Add to the UM realm wrapper override on the UM Linux host:
#   <UniversalMessaging>/server/<realm>/bin/custom_wrapper.conf
#
# UM 10.15+ SHIPS both the javaagent jar and the SAG metrics rules file - this
# line just switches the exporter ON, giving the rich native sag_um_* metrics
# (channels, durables, connections, threadpools, heap/direct/disk). No licence.
#
# INDEX: use the next free wrapper.java.additional.<N>; if the wrapper reports a
# sequence gap, add  wrapper.ignore_sequence_gaps=TRUE . Adjust paths/realm name.
# ============================================================================

wrapper.java.additional.401=-javaagent:/opt/softwareag/UniversalMessaging/lib/jmx_prometheus_javaagent.jar=9200:/opt/softwareag/UniversalMessaging/server/umserver/bin/jmx_sag_um_exporter.yaml

# wrapper.ignore_sequence_gaps=TRUE
