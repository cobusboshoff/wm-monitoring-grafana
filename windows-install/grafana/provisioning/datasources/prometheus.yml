# Grafana datasource provisioning - copy to <Grafana>\conf\provisioning\datasources\
# Wires the local Prometheus as the default (and only) datasource.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus            # stable UID the provisioned dashboards reference
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 30s        # match Prometheus scrape_interval
      httpMethod: POST
