# ============================================================================
# Integration Server - JMX Prometheus exporter (jvm_* metrics on :9099)
# ----------------------------------------------------------------------------
# This is a SNIPPET, not a whole file. Add the line(s) below to the IS
# instance's existing custom_wrapper.conf:
#
#   <IntegrationServer>\profiles\IS_<instance>\configuration\custom_wrapper.conf
#
# (custom_wrapper.conf is a supported override that IS merges into the wrapper
#  config on startup - you do NOT edit the generated wrapper.conf directly.)
#
# HOW IT WORKS
#   The jmx_prometheus_javaagent runs INSIDE the IS JVM and exposes JVM MBeans
#   (heap, GC, threads, classes) as Prometheus text on the port you give it -
#   here 9099. Prometheus scrapes http://localhost:9099/metrics.
#
# PICK THE INDEX (N)
#   wrapper.java.additional.<N> lines must be UNIQUELY numbered. Open the
#   instance's wrapper.conf + custom_wrapper.conf, find the highest existing
#   wrapper.java.additional.<N>, and use the next number. If the Java Service
#   Wrapper complains about a sequence gap, add:  wrapper.ignore_sequence_gaps=TRUE
#   (The example uses 401 - a high number unlikely to collide; change it to fit.)
#
# THE JAR
#   Use jmx_prometheus_javaagent-<version>.jar (0.20.0+). If you don't have it,
#   either copy the one that ships with Universal Messaging
#   (<UM>\lib\jmx_prometheus_javaagent.jar) or download it from
#   https://github.com/prometheus/jmx_exporter/releases
#   Place it (and jmx_exporter_config.yaml from this folder) somewhere readable,
#   e.g. C:\gauge\.
#
# MULTIPLE INSTANCES
#   Each IS instance has its own custom_wrapper.conf and its own JVM - give each
#   a DIFFERENT port (9099, 9100, ...) and add a matching target in prometheus.yml.
#
# NOTE ON BACKSLASHES
#   The wrapper reads Windows paths fine with single backslashes as shown.
# ============================================================================

wrapper.java.additional.401=-javaagent:C:\gauge\jmx_prometheus_javaagent.jar=9099:C:\gauge\jmx_exporter_config.yaml

# If the wrapper reports a numbering gap after adding the line above, uncomment:
# wrapper.ignore_sequence_gaps=TRUE
