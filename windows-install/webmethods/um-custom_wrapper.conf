# ============================================================================
# Universal Messaging - native sag_um_* Prometheus exporter (on :9200)
# ----------------------------------------------------------------------------
# This is a SNIPPET. Add the line below to the UM realm server's
# custom_wrapper.conf:
#
#   <UniversalMessaging>\server\<realmName>\bin\custom_wrapper.conf
#
# GOOD NEWS - NOTHING TO DOWNLOAD
#   UM 10.15+ SHIPS both the javaagent jar and the SAG metrics rules file:
#     jar    : <UniversalMessaging>\lib\jmx_prometheus_javaagent.jar
#     config : <UniversalMessaging>\server\<realmName>\bin\jmx_sag_um_exporter.yaml
#   The line below just switches the exporter ON by adding it to the JVM. It
#   produces the rich native sag_um_* metrics (channels, durables, connections,
#   threadpools, heap/direct/disk) that the UM dashboard uses - no licence needed.
#
# PICK THE INDEX (N)
#   Same rule as IS: use the next free wrapper.java.additional.<N>. Add
#   wrapper.ignore_sequence_gaps=TRUE if the wrapper complains about a gap.
#
# PATHS
#   Adjust the drive/paths to your install. Use the realm name of THIS UM server
#   (default realm bin folders are usually named 'umserver').
# ============================================================================

wrapper.java.additional.401=-javaagent:C:\SoftwareAG\UniversalMessaging\lib\jmx_prometheus_javaagent.jar=9200:C:\SoftwareAG\UniversalMessaging\server\umserver\bin\jmx_sag_um_exporter.yaml

# If the wrapper reports a numbering gap after adding the line above, uncomment:
# wrapper.ignore_sequence_gaps=TRUE
